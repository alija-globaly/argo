# vpc
aws_region: ap-southeast-2
vpc_id: vpc-26227943
subnet_id: subnet-91300ce6

# Instance Settings
instance_name: subash-ansible-machine
instance_type: t3.medium
# fresh ubuntu image
ami_id: ami-0b8d527345fdace59
# worker custom AMI
#ami_id: ami-081fc13fa16857370

key_name: agentcis-v3-stagging
### manual profile
#iam_instance_profile: arn:aws:iam::834033184010:instance-profile/subash-eks-ec2-irsa-sample

### terraform created profile
iam_instance_profile: arn:aws:iam::834033184010:instance-profile/Agentcis-staging-AWSLoadBalancerController-profile

# Security Group
security_group_name: Ansible-kubernetes-security-group

# Storage Settings
volume_size: 30
volume_type: gp3  # Options: gp2, gp3, io1, io2, st1, sc1

user_data: |
  #!/bin/bash
  mkdir -p /home/ubuntu/.ssh
  SSH_AUTHORIZED_FILE="/home/ubuntu/.ssh/authorized_keys"
  
  # Key 1 - subash main public key
  KEY1="ssh-rsa  DELL@DESKTOP-N70J5HB"
  
  # Key 2 - subash vm key
  KEY2="ssh-rsa  subash@local-server"
  
  # Add key1 if not present
  if ! grep -qF "$KEY1" "$SSH_AUTHORIZED_FILE"; then
    echo "$KEY1" >> "$SSH_AUTHORIZED_FILE"
    echo "Added subashvm@server key"
  else
    echo "subashvmw@server key already exists"
  fi
  
  # Add key2 if not present
  if ! grep -qF "$KEY2" "$SSH_AUTHORIZED_FILE"; then
    echo "$KEY2" >> "$SSH_AUTHORIZED_FILE"
    echo "Added subash@server key"
  else
    echo "subash@server key already exists"
  fi
  #chmod 600 /home/ubuntu/.ssh/authorized_keys

# User Data (startup script)
worker_user_data: |
  #!/bin/bash
  sleep 45
  #systemctl is-system-running --wait
  sudo -u ubuntu bash -c '
    set -e
    curl -fsSL \
      https://globalyhub-kubernetes-aws-provider.s3.ap-southeast-2.amazonaws.com/scripts/k8s-worker-node-setup.sh | \
      bash -s -- --worker subash-server-worker
  '

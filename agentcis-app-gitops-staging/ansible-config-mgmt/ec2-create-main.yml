- hosts: localhost
  remote_user: ubuntu
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/variables/color-code.yml"
    - "{{ playbook_dir }}/variables/k8s-variable.yml"    
    - "{{ playbook_dir }}/variables/aws-create-variable.yml"    
  vars:
    timestamp: "{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M') }}"
  tasks:
    - import_tasks: "{{ playbook_dir }}/tasks/aws-services/sg-create.yml"  
    - import_tasks: "{{ playbook_dir }}/tasks/aws-services/ec2-create.yml"
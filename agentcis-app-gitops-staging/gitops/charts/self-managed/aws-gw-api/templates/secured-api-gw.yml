# templates/gateway-complete.yaml - SINGLE FILE
{{- if .Values.gateway.https_mode.enabled }}
---
# LoadBalancerConfiguration
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: {{ .Values.gateway.https_mode.aws_alb_config.name }}
  namespace: {{ .Release.Namespace }}
spec:
  scheme: {{ .Values.gateway.https_mode.aws_alb_config.scheme }}
  ipAddressType: {{ .Values.gateway.https_mode.aws_alb_config.ipAddressType }}
  listenerConfigurations:
    - protocolPort: HTTP:80
      protocolPort: HTTPS:443
      defaultCertificate: {{ .Values.gateway.https_mode.aws_alb_config.defaultCertificate | quote }}
---
# Gateway
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.gateway.https_mode.k8s_api_gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.https_mode.k8s_api_gateway.gatewayClassName }}
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ .Values.gateway.https_mode.aws_alb_config.name }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.https_mode.k8s_api_gateway.listener_http_namespaces }}
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: {{ .Values.gateway.https_mode.k8s_api_gateway.listener_http_namespaces }}
---
# HTTPRoute - Redirect HTTP → HTTPS
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ include "aws-gateway.httpRedirectName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.https_mode.k8s_api_gateway.name }}
      kind: Gateway
      namespace: {{ .Release.Namespace }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      backendRefs: []  # Redirects ALL HTTP → HTTPS
{{- end }}

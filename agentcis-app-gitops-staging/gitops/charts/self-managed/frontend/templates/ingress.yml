{{- if .Values.frontend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.frontend.name }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.frontend.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  labels:
    app: {{ .Values.frontend.name }}-ingress
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  {{- if and .Values.frontend.ingress.enabled .Values.frontend.ingress.tlsEnabled }}
  tls:
  - hosts:
    - {{ .Values.frontend.ingress.host }}
    secretName: {{ .Values.frontend.name }}-tls
  {{- end }}
  rules:
  - host: {{ .Values.frontend.ingress.host }}
    http:
      paths:
      - path: {{ .Values.frontend.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.frontend.name }}-svc
            port:
              number: {{ .Values.frontend.service.port }}
{{- end }}
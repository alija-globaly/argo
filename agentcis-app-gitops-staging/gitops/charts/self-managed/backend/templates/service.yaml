{{- if .Values.backend.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.backend.name }}-service
    {{- with .Values.backend.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    app: {{ .Values.backend.name }}
  type: {{ .Values.backend.service.type }}
  ports:
  {{- if .Values.backend.service.portTwo }}
    - name: {{ .Values.backend.service.portNameOne }}
      port: {{ .Values.backend.service.portOne }}
      targetPort: {{ .Values.backend.service.targetPortOne }}
      {{- if .Values.backend.service.nodePortOne }}
      nodePort: {{ .Values.backend.service.nodePortOne }}
      {{- end }}
      protocol: TCP
    - name: {{ .Values.backend.service.portNameTwo }}
      port: {{ .Values.backend.service.portTwo }}
      targetPort: {{ .Values.backend.service.targetPortTwo }}
      {{- if .Values.backend.service.nodePortTwo }}
      nodePort: {{ .Values.backend.service.nodePortTwo }}
      {{- end }}
      protocol: TCP
  {{- else }}
    - name: {{ .Values.backend.name }}-port
      port: {{ .Values.backend.service.svcport }}
      targetPort: {{ .Values.backend.service.containerport }}
      protocol: TCP
  {{- end }}
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
{{- end }}
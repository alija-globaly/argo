apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.backend.name }}

spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
    spec:
      {{- if .Values.backend.imagePullSecrets.enabled }}
      imagePullSecrets:
      - name: {{ .Values.backend.imagePullSecrets.name }}
      {{- end }}
      containers:
      - name: {{ .Values.backend.name }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        {{- if .Values.backend.startupCommand.enabled }}
        command: 
          - {{ .Values.backend.startupCommand.shell | quote }}
          - "-c"
        args:
          - |
{{ .Values.backend.startupCommand.command | indent 12 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.backend.service.containerport }}


        {{- if .Values.backend.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.backend.livenessProbe.httpGet.path | default "/health-check" }}
            port: {{ .Values.backend.livenessProbe.httpGet.port | default 3002 }}
          initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds | default 15 }}
          periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds | default 20 }}
          failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold | default 3 }}
        {{- end }}    


        {{- if .Values.backend.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.backend.readinessProbe.httpGet.path | default "/health-check" }}
            port: {{ .Values.backend.readinessProbe.httpGet.port | default 3002 }}
          initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds | default 15 }}
          periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds | default 20 }}
          failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold | default 3 }}
        {{- end }}    


        {{- if .Values.backend.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: {{ .Values.backend.startupProbe.httpGet.path | default "/health-check" }}
            port: {{ .Values.backend.startupProbe.httpGet.port | default 3002 }}
          initialDelaySeconds: {{ .Values.backend.startupProbe.initialDelaySeconds | default 15 }}
          periodSeconds: {{ .Values.backend.startupProbe.periodSeconds | default 20 }}
          failureThreshold: {{ .Values.backend.startupProbe.failureThreshold | default 3 }}
        {{- end }}
        

        {{- if .Values.backend.volumes.enabled }}
        volumeMounts:
        {{- if .Values.backend.volumes.env.enabled }}
        - name: env-volume
          mountPath: {{ .Values.backend.volumes.env.mountPath | quote }}
          subPath: {{ .Values.backend.volumes.env.subPath }}
        {{- end }}

        
        {{- if .Values.backend.volumes.logs.enabled }}
        - name: log-volume
          mountPath: {{ .Values.backend.volumes.logs.mountPath | quote }}
          subPath: {{ .Values.backend.volumes.logs.subPath }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
      {{- if .Values.backend.affinity.enabled }}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          {{- range .Values.backend.affinity.preferredNodes }}
          - weight: {{ .weight }}
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .hostname }}
          {{- end }}
      {{- end }}
      {{- if .Values.backend.volumes.enabled }}
      volumes:
      {{- if .Values.backend.volumes.env.enabled }}
      - name: env-volume
        persistentVolumeClaim:
          claimName: {{ .Values.backend.volumes.env.pvcName }}
      {{- end }}
      {{- if .Values.backend.volumes.logs.enabled }}
      - name: log-volume
        persistentVolumeClaim:
          claimName: {{ .Values.backend.volumes.logs.pvcName }}
      {{- end }}
      {{- end }}
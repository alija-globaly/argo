backend:
  name: agentcis-backend
  replicaCount: 1
  
  image:
    repository: 834033184010.dkr.ecr.ap-southeast-2.amazonaws.com/api
    tag: "api-12-15-36636bd"
    pullPolicy: IfNotPresent

  imagePullSecrets:
    enabled: true
    name: ecr-registry-secret
  
  startupCommand:
    enabled: true
    shell: /bin/bash
    command: |
      echo "-------------------------------"
      echo "k8s => restarting nginx"
      service nginx restart
      echo "-------------------------------"
      echo "k8s => starting NODE backend"
      echo "-------------------------------"
      mkdir -p public/uploads/
      mkdir -p storage/uploads
      mkdir -p storage/framework/views
      mkdir -p storage/framework/cache
      mkdir -p storage/framework/sessions
      mkdir -p storage/logs  
      chmod -R 777  storage/
      chmod -R 777  bootstrap/cache 
      chmod -R 777  public/uploads/
      php-fpm -y /usr/local/etc/php-fpm.conf -R      
  resources:
    requests:
      memory: "200Mi"
    limits:
      memory: "300Mi"
  
  volumes:
    enabled: true
    env:
      enabled: true
      pvcName: nfs-email-summary-config-pvc
      mountPath: /prod/packages/email-summary-service/.env
      subPath: backend.env
    logs:
      enabled: true
      pvcName: nfs-email-summary-log-pvc
      mountPath: /prod/packages/email-summary-service/logs
      subPath: email-summary-backend-log
  
  affinity:
    enabled: true
    preferredNodes:
      - hostname: agentcis-staging-k8s-master-172-34-28-189
        weight: 100
      - hostname: other-server
        weight: 50
  
  service:
    enabled: true
    type: ClusterIP
    port: 3005
  
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 50
    scaleUp:
      podsValue: 2
    scaleDown:
      podsValue: 1


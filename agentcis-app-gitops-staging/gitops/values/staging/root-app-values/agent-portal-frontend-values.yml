frontend:
  name: agent-portal-frontend
  replicaCount: 1

  image:
    repository: 834033184010.dkr.ecr.ap-southeast-2.amazonaws.com/sub-agent-control-frontend
    tag: sub-agent-control-frontend-01-16-6f6659f
    pullPolicy: IfNotPresent

  imagePullSecrets:
    enabled: true
    name: ecr-registry-secret

  startupCommand:
    enabled: false
    shell: /bin/sh
    command: |
      echo "-------------------------------"
      echo "k8s => restarting nginx"
      echo "-------------------------------"
      service nginx start
      echo "k8s => restarting nginx"
      echo "-------------------------------"
      echo "k8s => starting NODE frontend"
      echo "-------------------------------"
      node .output/server/index.mjs

  resources:
    requests:
      memory: "100Mi"
    limits:
      memory: "100Mi"

  pv:
    config:
      name: nfs-pv-agent-portal-config-test
      capacity: 5Gi
      nfsPath: /agentcis-manifest/agent-portal/config
      nfsServer: nfs.agentcisinteral.com
      reclaimPolicy: Retain
    log:
      name: nfs-pv-agent-portal-log-test
      capacity: 5Gi
      nfsPath: /agentcis-pvc/helm-test
      nfsServer: nfs.agentcisinteral.com
      reclaimPolicy: Retain


  volumes:
    enabled: true
    env:
      enabled: true
      pvcName: nfs-agent-portal-config-pvc-test
      nginxOneMountPath: /etc/nginx/nginx.conf
      nginxOneSubPath: nginx.conf

      nginxTwoMountPath: /etc/nginx/conf.d/sub-agent-control-frontend-nginx.conf
      nginxTwoSubPath: sub-agent-control-frontend-nginx.conf


    logs:
      enabled: true
      pvcName: nfs-agent-portal-log-pvc-test
      mountPath: /var/log/nginx
      subPath: sub-agent-control-frontend-log

  affinity:
    enabled: false
    preferredNodes:
      - hostname: agentcis-staging-k8s-master-172-34-28-189
        weight: 100
      - hostname: other-server
        weight: 50

  # probe configurations
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 30
  
  startupProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 10
    
  service:
    enabled: true
    type: ClusterIP
    containerport: 80
    svcport: 80

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 50
    scaleUp:
      podsValue: 2
    scaleDown:
      podsValue: 1
  ingress:
    enabled: false
    clusterIssuer: lets-encrypt-production
    tlsEnabled: false
    host: staging.agentcis.com
    path: /
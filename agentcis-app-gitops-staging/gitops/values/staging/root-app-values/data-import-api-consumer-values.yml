backendConsumer:
  name: agentcis-data-import-backend-consumer
  replicaCount: 1

  image:
    repository: 834033184010.dkr.ecr.ap-southeast-2.amazonaws.com/backend-consumer
    tag: "import-backend-02-06-de44f32"
    pullPolicy: IfNotPresent

  imagePullSecrets:
    enabled: false
    name: ecr-registry-secret

  startupCommand:
    enabled: true
    shell: /bin/sh
    command: |
      echo "-------------------------------"
      echo "k8s => restarting nginx"
      service nginx restart
      echo "-------------------------------"
      echo "k8s => starting data-import consumer"
      echo "-------------------------------"
      pnpm start:import-consumer | tee -a /prod/packages/import-backend/logs/data-import-consumer.log 

  resources:
    requests:
      memory: "200Mi"
    limits:
      memory: "300Mi"

  pv:
    config:
      name: nfs-pv-data-backend-consumer-config-test
      capacity: 5Gi
      nfsPath: /agentcis-manifest/data-import/config
      nfsServer: nfs.agentcisinteral.com
      reclaimPolicy: Retain
    log:
      name: nfs-pv-data-backend-consumer-log-test
      capacity: 5Gi
      nfsPath: /agentcis-pvc/helm-test
      nfsServer: nfs.agentcisinteral.com
      reclaimPolicy: Retain

  volumes:
    enabled: true
    env:
      enabled: true
      pvcName: nfs-data-import-backend-consumer-config-pvc-test
      mountPath: /prod/packages/import-backend/.env
      subPath: backend.env
    logs:
      enabled: true
      pvcName: nfs-data-import-backend-consumer-pvc-test
      mountPath: /prod/packages/import-backend/logs
      subPath: import-backend-consumer

  affinity:
    enabled: false
    preferredNodes:
      - hostname: agentcis-staging-k8s-master-172-34-28-189
        weight: 100
      - hostname: other-server
        weight: 50

  httpPort: 3002

  livenessProbe:
    enabled: true
    httpGet:
      path: /health-check
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3

  startupProbe:
    enabled: true
    httpGet:
      path: /health-check
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 5

  readinessProbe:
    enabled: false

  service:
    enabled: true
    type: ClusterIP
    containerport: 3002
    svcport: 3002

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 50
    scaleUp:
      podsValue: 2
    scaleDown:
      podsValue: 1


  ingress:
    enabled: false
    clusterIssuer: lets-encrypt
    className: nginx
    host: subash.globalyhub.com
    path: /
    
  httproute:
    enabled: false
    gateway:
      name: "agentcisapp-stage-alb-gateway"
      namespace: "agentcisapp-gateway"
      sectionName: "https"
    httpMultipleRoute:
      paths:
        - /api/v1/agent-portal
    urlRewriteEnabled: false

  targetGroupConfiguration:
    enabled: false
    targetType: "instance"
    healthCheckPath: "/nginx-health"
    healthCheckProtocol: "HTTP"
    healthCheckPort: "80"
    healthCheckInterval: 5
    healthCheckTimeout: 4      # ← ADD THIS LINE
    healthyThresholdCount: 2
    unhealthyThresholdCount: 2
    matcher:
      httpCode: "200-399,401-404"
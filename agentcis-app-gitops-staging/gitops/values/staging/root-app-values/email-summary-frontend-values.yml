backend:
  name: agentcis-email-summary-backend
  replicaCount: 1

  image:
    repository: 834033184010.dkr.ecr.ap-southeast-2.amazonaws.com/email-summary-backend
    tag: "email-summary-backend-01-19-596de9b"
    pullPolicy: IfNotPresent

  imagePullSecrets:
    enabled: true
    name: ecr-registry-secret

  startupCommand:
    enabled: true
    shell: /bin/sh
    command: |
      echo "-------------------------------"
      echo "k8s => restarting nginx"
      service nginx restart 
      echo "-------------------------------"
      echo "k8s => starting NODE backend"
      echo "-------------------------------"
      pnpm dev | tee -a /prod/packages/email-summary-service/logs/email-summary-backend.log

  resources:
    requests:
      memory: "390Mi"
    limits:
      memory: "390Mi"

  pv:
    config:
      name: nfs-pv-email-summary-config-backend-test
      capacity: 5Gi
      nfsPath: /agentcis-manifest/email-summary/config
      nfsServer: nfs.agentcisinteral.com
      reclaimPolicy: Retain
    log:
      name: nfs-pv-email-summary-log-backend-test
      capacity: 5Gi
      nfsPath: /agentcis-pvc/helm-test
      nfsServer: nfs.agentcisinteral.com
      reclaimPolicy: Retain

  volumes:
    enabled: true
    env:
      enabled: true
      pvcName: nfs-email-summary-backend-config-pvc-test
      mountPath: /prod/packages/email-summary-service/.env
      subPath: backend.env
    logs:
      enabled: true
      pvcName: nfs-email-summary-backend-pvc-test
      mountPath: /prod/packages/email-summary-service/logs
      subPath: email-summary-backend-log

  affinity:
    enabled: false
    preferredNodes:
      - hostname: agentcis-staging-k8s-master-172-34-28-189
        weight: 100
      - hostname: other-server
        weight: 50

  # probe configurations
  livenessProbe:
    enabled: true
    httpGet:
      path: /health-check
      port: 3005
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /health-check
      port: 3005
    initialDelaySeconds: 30
    periodSeconds: 30
  
  startupProbe:
    enabled: true
    httpGet:
      path: /health-check
      port: 3005
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3



  service:
    enabled: true
    type: ClusterIP
    containerport: 3005
    svcport: 3005

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 50
    scaleUp:
      podsValue: 2
    scaleDown:
      podsValue: 1


  ingress:
    enabled: false
    clusterIssuer: lets-encrypt
    className: nginx
    host: subash.globalyhub.com
    path: /
    
  httproute:
    enabled: false
    gateway:
      name: "agentcisapp-stage-alb-gateway"
      namespace: "agentcisapp-gateway"
      sectionName: "https"
    httpMultipleRoute:
      paths:
        - /api/v1/agent-portal
    urlRewriteEnabled: false

  targetGroupConfiguration:
    enabled: false
    targetType: "instance"
    healthCheckPath: "/nginx-health"
    healthCheckProtocol: "HTTP"
    healthCheckPort: "80"
    healthCheckInterval: 5
    healthCheckTimeout: 4      # ← ADD THIS LINE
    healthyThresholdCount: 2
    unhealthyThresholdCount: 2
    matcher:
      httpCode: "200-399,401-404"
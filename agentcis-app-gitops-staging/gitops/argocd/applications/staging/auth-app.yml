apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentcis-data-import-auth-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/alija-globaly/argo.git"
    targetRevision: "main"
    path: "agentcis-app-gitops-staging/gitops/charts/self-managed/backend"
    helm:
      valueFiles:
        - ../../../values/staging/root-app-values/auth-values.yml 
  destination:
    server: https://kubernetes.default.svc
    namespace: agentcis-data-import-auth-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground

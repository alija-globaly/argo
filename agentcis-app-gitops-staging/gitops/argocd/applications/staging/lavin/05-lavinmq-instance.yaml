apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lavinmq-instance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"    # ← deploys last
spec:
  project: default
  source:
    repoURL: https://your-git-repo.com/lavinmq-helm
    targetRevision: HEAD
    path: lavinmq-instance
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
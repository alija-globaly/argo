apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: "arn:aws:iam::834033184010:role/Agentcis-general-nodes-EKSNodes"
      groups:
      - system:bootstrappers
      - system:nodes
      username: system:node:{{EC2PrivateDNSName}}
    - rolearn: "arn:aws:iam::834033184010:role/bastion_role"
      groups:
      - system:masters
      username: kubernetes-admin

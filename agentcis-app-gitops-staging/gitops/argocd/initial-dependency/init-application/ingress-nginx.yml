apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx  # Fixed: was kube-prometheus-stack
    targetRevision: 4.14.0  # Latest chart version
    helm:
      valueFiles:
        - $values/gitops/values/staging/init-app-values/k8s-ingress-values.yml
  - repoURL: https://github.com/GlobalyHub/agentcis-app-gitops.git
    targetRevision: "staging"
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true 
      - PrunePropagationPolicy=foreground            
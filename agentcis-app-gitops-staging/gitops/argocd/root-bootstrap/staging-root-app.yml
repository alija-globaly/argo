apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 00-bootstrap-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: "gitops/argocd/applications/staging"
    repoURL: "https://github.com/GlobalyHub/agentcis-app-gitops.git"
    targetRevision: "staging"
    directory:                    # ADD THIS
      recurse: true    
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true 
      - PrunePropagationPolicy=foreground       
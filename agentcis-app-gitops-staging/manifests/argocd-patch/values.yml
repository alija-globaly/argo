
####### values - referecne : https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
####### reference : https://argocd-operator.readthedocs.io/en/latest/usage/resource_management/
crds:
  # Skip CRD installation since they already exist from v1-argo-cd
  install: true
  # Keep CRDs on chart uninstall
  keep: false
# redis-ha:
#   enabled: false
#   haproxy:
#     replicaCount: 1  # Fixed key name
#   master:
#     replicaCount: 1   # Single master for 2-node cluster
# controller:
#   replicas: 1
controller:
  resources:
    limits:
      cpu: '1'
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
applicationSet:
  replicas: 1
  resources:
    limits:
      cpu: '2'
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi  
server:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 128Mi
redis:
  enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi

repoServer:
  replicas: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gw
  namespace: nginx-gateway  # Where your NGINX controller lives
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shyam-route
  namespace: shyam
spec:
  parentRefs:
  - name: nginx-gw
    namespace: nginx-gateway
    port: 80
    sectionName: http
  hostnames:
  - "shyam.globalyhub.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: shyam
      port: 29000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subash-route
  namespace: subash
spec:
  parentRefs:
  - name: nginx-gw
    namespace: nginx-gateway
    port: 80
    sectionName: http
  hostnames:
  - "subash.globalyhub.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: subash-web
      port: 29000
---
# shyam namespace
apiVersion: gateway.networking.k8s.io/v1beta1  # Changed to v1beta1
kind: ReferenceGrant
metadata:
  name: allow-nginx-ref
  namespace: shyam
spec:
  from:
  - namespace: nginx-gateway
    group: gateway.networking.k8s.io
    kind: HTTPRoute
  to:
  - group: ""
    kind: Service
---
# subash namespace
apiVersion: gateway.networking.k8s.io/v1beta1  # Changed to v1beta1
kind: ReferenceGrant
metadata:
  name: allow-nginx-ref
  namespace: subash
spec:
  from:
  - namespace: nginx-gateway
    group: gateway.networking.k8s.io
    kind: HTTPRoute
  to:
  - group: ""
    kind: Service
